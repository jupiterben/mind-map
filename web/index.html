<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width,user-scalable=no,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0"
    />
    <link rel="icon" href="dist/logo.ico" />
    <link rel="preload" href="/src/assets/icon-font/iconfont.woff2?t=1739843331607" as="font" type="font/woff2" crossorigin="" />
    <title>思绪思维导图</title>
    <script>
      window.externalPublicPath = './dist/'
      window.takeOverApp = false
    </script>
  </head>
  <body>
    <noscript>
      <strong>请启用 JavaScript 以使用本应用。</strong>
    </noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      const getDataFromBackend = () => {
        return new Promise((resolve, reject) => {
          setTimeout(() => {
            resolve({
              mindMapData: {
                root: {
                  data: {
                    text: '根节点'
                  },
                  children: []
                },
                theme: {
                  template: 'avocado',
                  config: {}
                },
                layout: 'logicalStructure',
                config: {},
                view: null
              },
              mindMapConfig: {},
              lang: 'zh',
              localConfig: null
            })
          }, 200)
        })
      }
      const setTakeOverAppMethods = data => {
        window.takeOverAppMethods = {}
        window.takeOverAppMethods.getMindMapData = () => data.mindMapData
        window.takeOverAppMethods.saveMindMapData = data => console.log(data)
        window.takeOverAppMethods.getMindMapConfig = () => data.mindMapConfig
        window.takeOverAppMethods.saveMindMapConfig = config => console.log(config)
        window.takeOverAppMethods.getLanguage = () => data.lang
        window.takeOverAppMethods.saveLanguage = lang => console.log(lang)
        window.takeOverAppMethods.getLocalConfig = () => data.localConfig
        window.takeOverAppMethods.saveLocalConfig = config => console.log(config)
      }
      window.onload = async () => {
        if (!window.takeOverApp) return
        const data = await getDataFromBackend()
        setTakeOverAppMethods(data)
        if (window.$bus) window.$bus.on('app_inited', mindMap => console.log(mindMap))
        window.initApp()
      }
    </script>
  </body>
</html>
